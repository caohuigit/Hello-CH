<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      color: #333;
    }

    h1 {
      font-size: 15px;
      text-align: center;
      margin-bottom: 16px;
      color: #1a73e8;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #1a73e8;
      color: #fff;
    }

    .btn-primary:hover { background: #1557b0; }
    .btn-primary:disabled { background: #a0c4ff; cursor: not-allowed; }

    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #666;
      min-height: 20px;
    }

    .progress-bar {
      margin-top: 8px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.active { display: block; }

    .progress-bar-inner {
      height: 100%;
      background: #1a73e8;
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>滚动截图工具</h1>
  <button id="captureBtn" class="btn btn-primary">开始截图</button>
  <div class="progress-bar" id="progressBar">
    <div class="progress-bar-inner" id="progressInner"></div>
  </div>
  <div id="status"></div>
  <div class="hint">截图完成后将打开预览页面</div>
  <script src="popup.js"></script>
</body>
</html>
